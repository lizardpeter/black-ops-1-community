name: Windows multiplayer build

on:
  push:
    paths-ignore:
      - '.github/workflows/windows-game-smoke.yml'
      - 'scripts/stage_bo1_r2.py'
      - 'scripts/smoke_bo1.ps1'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [faithful, enhanced]
        configuration: [Debug, Release]
        include:
          - edition: enhanced-x64
            configuration: Release

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Extract DirectX SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'DXSDK_Jun10.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'directx-sdk'
          $architecture = if ('${{ matrix.edition }}' -eq 'enhanced-x64') { 'x64' } else { 'x86' }
          $url = 'https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe'
          curl.exe --fail --location --retry 3 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw 'DirectX SDK download failed' }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $installer "-o$extract" 'DXSDK/Include/*' "DXSDK/Lib/$architecture/*" -r -y
          if ($LASTEXITCODE -ne 0) { throw 'DirectX SDK extraction failed' }
          $sdk = Join-Path $extract 'DXSDK'
          if (!(Test-Path (Join-Path $sdk 'Include/d3dx9.h'))) { throw 'DirectX SDK headers missing' }
          "DXSDK_DIR=$sdk" >> $env:GITHUB_ENV

      - name: Configure and build
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          $configuration = '${{ matrix.configuration }}'
          cmake --preset $edition
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset "$edition-$($configuration.ToLowerInvariant())"

      - name: Test enhanced FOV
        if: matrix.edition == 'enhanced' || matrix.edition == 'enhanced-x64'
        run: ctest --test-dir build/enhanced -C ${{ matrix.configuration }} --output-on-failure

      - name: Check executable
        shell: pwsh
        run: |
          $edition = '${{ matrix.edition }}'
          $configuration = '${{ matrix.configuration }}'
          $file = if ($edition -like 'enhanced*') { 'BlackOpsMP-Community.exe' } else { 'KisakBlack.exe' }
          $path = "build/$edition/$configuration/$file"
          if (!(Test-Path $path -PathType Leaf)) {
            Write-Host "::error::Expected executable missing at $path"
            exit 1
          }
          $exe = Get-Item $path
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = if ($edition -eq 'enhanced-x64') { 0x8664 } else { 0x14c }
          if ([BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x4550 -or
              [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne $machine) {
            Write-Host "::error::Unexpected Windows executable architecture at $exe"
            exit 1
          }
          if ($edition -like 'enhanced*') {
            $description = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileDescription
            if ($description -cne 'Black Ops Multiplayer - Community Enhanced') {
              Write-Host "::error::Unexpected file description '$description' in $path"
              exit 1
            }
          }

      - name: Record executable DLL imports
        if: matrix.edition == 'enhanced'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x86\dumpbin.exe' |
            Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin.exe missing' }
          $configuration = '${{ matrix.configuration }}'
          $imports = & $dumpbin /nologo /dependents "build/enhanced/$configuration/BlackOpsMP-Community.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dlls = $imports | ForEach-Object { if ($_ -match '^\s+(\S+\.dll)\s*$') { $Matches[1] } }
          if (!$dlls) { throw 'No DLL imports found' }
          $removed = $dlls -match '^(xinput.*|steam.*|tier0_s.*|vstdlib_s.*|bink.*)\.dll$'
          if ($removed) {
            Write-Host "::error::Enhanced build unexpectedly imports $($removed -join ', ')"
            exit 1
          }
          Write-Host "::notice title=Executable DLL imports::$($dlls -join ', ')"
          "### DLL imports ($configuration)" >> $env:GITHUB_STEP_SUMMARY
          '' >> $env:GITHUB_STEP_SUMMARY
          $imports | ForEach-Object { "    $_" >> $env:GITHUB_STEP_SUMMARY }
